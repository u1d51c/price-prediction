# Локальная инфраструктура для чекпоинта 7:
#   minio  - S3-совместимое хранилище артефактов MLflow
#   mlflow - tracking server, метаданные в SQLite, артефакты в minio (s3://mlflow)
#
# Запуск:
#   cd docker && docker compose up -d
# Веб-интерфейсы:
#   MLflow:        http://localhost:5001  (на macOS порт 5000 занят AirPlay)
#   MinIO Console: http://localhost:9001  (логин/пароль см. ниже)

services:
  minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web-консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # одноразовый init: создаёт бакет mlflow, если его нет
  minio-init:
    image: minio/mc:latest
    container_name: mlflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/mlflow || true &&
      mc anonymous set download local/mlflow || true
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: mlflow-server
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "5001:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_HOST: 0.0.0.0
      MLFLOW_PORT: "5000"
    entrypoint:
      - bash
      - -c
      - >
        pip install --quiet boto3 &&
        mlflow server
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root s3://mlflow/
        --host 0.0.0.0
        --port 5000
    volumes:
      - mlflow_data:/mlflow

volumes:
  minio_data:
  mlflow_data:
